<!-- ==================== 社区化纯净白底爱心奉献支持弹窗 ==================== -->
<div id="giving-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 overflow-y-auto" onclick="closeGivingModal(event)">
    <div class="bg-white border border-neutral-200 rounded-3xl max-w-lg w-full p-6 sm:p-8 relative text-left shadow-2xl my-auto max-h-[92vh] flex flex-col justify-between overflow-y-auto text-neutral-900" onclick="event.stopPropagation()">
        
        <!-- 关闭按钮 -->
        <button type="button" onclick="closeGivingModal()" class="absolute top-5 right-5 text-neutral-400 hover:text-neutral-700 p-1.5 rounded-full hover:bg-neutral-100 transition-colors z-20" aria-label="关闭">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <!-- 弹窗顶栏：核心祝福语句置顶 -->
        <div class="text-center pb-5 border-b border-neutral-100 pr-6 pl-6">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-neutral-100 text-[10px] font-mono-code font-bold text-neutral-600 uppercase tracking-widest">
                MOMO COMMUNITY GIVING · 爱心支持
            </span>
            <h3 class="text-2xl sm:text-[26px] font-black text-black mt-2 tracking-tight">
                愿上帝祝福你乐意帮助的好行为
            </h3>
            <p class="text-xs text-neutral-600 mt-1.5 leading-relaxed">
                感谢你以实际行动支持 Momo 音乐教育与社群同行。
            </p>
        </div>

        <!-- 核心内容 -->
        <div class="space-y-4 py-5">
            
            <!-- 下拉选择框：选择支持项目 -->
            <div>
                <label for="giving-project-select" class="block text-xs font-bold text-neutral-800 mb-1.5">
                    选择您愿意支持的项目，我们会专项用于对应领域 <span class="text-red-500">*</span>
                </label>
                <select
                    id="giving-project-select"
                    onchange="onGivingProjectChange()"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-neutral-300 bg-neutral-50 text-sm font-semibold text-neutral-900 focus:outline-none focus:ring-2 focus:ring-black"
                >
                    <option value="direct">直接支持 Momo（自由支配 · 支持社群发展与日常教学）</option>
                    <option value="equipment">Momo 教学设备（琴房乐器与排练器材更新）</option>
                    <option value="scholarship">Momo 助学金池（资助经济困难家庭学子）</option>
                    <option value="community">Momo 社群活动（青年乐队合奏与音乐沙龙）</option>
                    <option value="charity">大凉山音乐支教（乡村儿童乐器采购与教学）</option>
                </select>
            </div>

            <!-- 支付方式切换 Tab -->
            <div>
                <div class="flex items-center justify-between text-xs font-bold mb-2">
                    <span class="text-neutral-700">扫码支持通道</span>
                    <span class="text-[11px] text-neutral-500 font-normal">支持微信与支付宝</span>
                </div>
                <div class="grid grid-cols-2 gap-2 p-1 bg-neutral-100 rounded-xl">
                    <button
                        type="button"
                        id="tab-btn-wechat"
                        onclick="switchGivingTab('wechat')"
                        class="py-2 rounded-lg text-xs font-bold transition-all bg-white text-emerald-700 shadow-sm flex items-center justify-center gap-1.5"
                    >
                        <span>💚 微信支付</span>
                    </button>
                    <button
                        type="button"
                        id="tab-btn-alipay"
                        onclick="switchGivingTab('alipay')"
                        class="py-2 rounded-lg text-xs font-bold transition-all text-neutral-600 hover:text-black flex items-center justify-center gap-1.5"
                    >
                        <span>💙 支付宝</span>
                    </button>
                </div>
            </div>

            <!-- 收款码展示卡片 (纯净白底 · 绝不破图) -->
            <div class="p-4 rounded-2xl bg-neutral-50 border border-neutral-200 text-center">
                <div id="giving-qr-wechat" class="space-y-2">
                    <div class="w-48 sm:w-52 mx-auto rounded-xl overflow-hidden border border-neutral-200 shadow-sm bg-white p-2">
                        <img src="./assets/images/payment/wechat_pay_card.png" alt="MOMO 微信官方收款码" class="w-full aspect-square object-contain rounded-lg">
                    </div>
                    <div class="text-[11px] text-neutral-600 font-medium">
                        微信官方商户号：<strong>MOMO 共创中心</strong>
                    </div>
                </div>

                <div id="giving-qr-alipay" class="hidden space-y-2">
                    <div class="w-48 sm:w-52 mx-auto rounded-xl overflow-hidden border border-neutral-200 shadow-sm bg-white p-2">
                        <img src="./assets/images/payment/alipay_card.png" alt="MOMO 支付宝官方收款码" class="w-full aspect-square object-contain rounded-lg">
                    </div>
                    <div class="text-[11px] text-neutral-600 font-medium">
                        支付宝官方商户：<strong>Momo 音乐</strong>
                    </div>
                </div>

                <!-- 备注提醒条 -->
                <div class="mt-3 pt-3 border-t border-neutral-200/80 text-[11px] text-neutral-600 leading-relaxed font-mono-code">
                    <span>💡 转账时建议在备注栏写上您的名字与支持项目（例如：</span>
                    <span id="giving-suggested-memo" class="font-bold text-neutral-900 bg-white px-1.5 py-0.5 rounded border border-neutral-300">直接支持·您的名字</span>
                    <span>），方便我们记入芳名录。</span>
                </div>
            </div>

            <!-- 底部主理人直接联系 -->
            <div class="flex items-center justify-between text-xs text-neutral-500 pt-1">
                <span>如有大额或对公支持需求：</span>
                <button type="button" onclick="closeGivingModal(); openTimoModal();" class="text-black font-bold hover:underline inline-flex items-center gap-1">
                    <span>联系主理人 Timo 微信 &rarr;</span>
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    let currentGivingTab = 'wechat';

    function switchGivingTab(tab) {
        currentGivingTab = tab;
        const btnWechat = document.getElementById('tab-btn-wechat');
        const btnAlipay = document.getElementById('tab-btn-alipay');
        const qrWechat = document.getElementById('giving-qr-wechat');
        const qrAlipay = document.getElementById('giving-qr-alipay');

        if (tab === 'wechat') {
            if (btnWechat) btnWechat.className = 'py-2 rounded-lg text-xs font-bold transition-all bg-white text-emerald-700 shadow-sm flex items-center justify-center gap-1.5';
            if (btnAlipay) btnAlipay.className = 'py-2 rounded-lg text-xs font-bold transition-all text-neutral-600 hover:text-black flex items-center justify-center gap-1.5';
            if (qrWechat) qrWechat.classList.remove('hidden');
            if (qrAlipay) qrAlipay.classList.add('hidden');
        } else {
            if (btnAlipay) btnAlipay.className = 'py-2 rounded-lg text-xs font-bold transition-all bg-white text-blue-700 shadow-sm flex items-center justify-center gap-1.5';
            if (btnWechat) btnWechat.className = 'py-2 rounded-lg text-xs font-bold transition-all text-neutral-600 hover:text-black flex items-center justify-center gap-1.5';
            if (qrAlipay) qrAlipay.classList.remove('hidden');
            if (qrWechat) qrWechat.classList.add('hidden');
        }
    }

    function onGivingProjectChange() {
        const select = document.getElementById('giving-project-select');
        const memoBadge = document.getElementById('giving-suggested-memo');
        if (!select || !memoBadge) return;
        const val = select.value;
        let tag = '直接支持';
        if (val === 'equipment') tag = '设备支持';
        else if (val === 'scholarship') tag = '助学金';
        else if (val === 'community') tag = '社群活动';
        else if (val === 'charity') tag = '支教支持';
        memoBadge.textContent = tag + '·您的名字';
    }

    function openGivingModal(itemTitle, category) {
        const modal = document.getElementById('giving-modal');
        const select = document.getElementById('giving-project-select');
        if (select && category) {
            if (category === 'equipment') select.value = 'equipment';
            else if (category === 'scholarship') select.value = 'scholarship';
            else if (category === 'charity') select.value = 'charity';
            else if (category === 'community') select.value = 'community';
            else select.value = 'direct';
            onGivingProjectChange();
        }
        if (modal) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }
    }

    function closeGivingModal(e) {
        if (e && e.target !== e.currentTarget) return;
        const modal = document.getElementById('giving-modal');
        if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }
    }
</script>
