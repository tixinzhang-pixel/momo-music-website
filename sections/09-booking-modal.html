<!-- 10. 全功能预约弹窗 (Booking Modal) -->
  <div class="modal-backdrop" id="bookingModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box border-card">
      <button class="modal-close-btn" id="modalCloseBtn" aria-label="关闭弹窗">&times;</button>
      
      <div class="modal-header">
        <span class="pill-tag"><span class="pulse-dot"></span> DIRECT CONNECT</span>
        <h3 class="modal-title">预约试奏 · 空间探访 · 会员咨询</h3>
        <p class="modal-subtitle">提交后，我们将由创始人与专属家庭音乐管家在 24 小时内与您联络。</p>
      </div>

      <form id="bookingForm" class="modal-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="formName">您的称呼 / 孩子姓名 <span class="required">*</span></label>
            <input type="text" id="formName" name="name" placeholder="例如：李先生 / Henry" required>
          </div>
          <div class="form-group">
            <label for="formPhone">联系电话 / 微信 <span class="required">*</span></label>
            <input type="tel" id="formPhone" name="phone" placeholder="接收专属联络信息" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="formCategory">意向探索方向 <span class="required">*</span></label>
            <select id="formCategory" name="category" required>
              <option value="综合探访与试听">线下空间沉浸探访 & 试听</option>
              <option value="原声低音提琴 Double Bass">原声立式大贝斯 Double Bass</option>
              <option value="现代电贝斯与律动">现代电贝斯 (Funk Slap / Neo-Soul)</option>
              <option value="电吉他单块效果器与声音设计">电吉他单块效果器链路与声音设计</option>
              <option value="非古典现代弦乐先锋提琴">非古典·现代弦乐先锋小提琴组</option>
              <option value="爵士键盘舞台电钢与合成器">爵士键盘、舞台电钢与合成器</option>
              <option value="青少年现代爵士大乐队考核">Momo 青少年现代爵士大乐队考核</option>
              <option value="Momo 家庭年费会员 Plus">Momo 家庭音乐年费会员 Plus 申请</option>
              <option value="神经多样性温柔陪伴定制">特别感知力 (ADHD/高敏感) 温柔陪伴</option>
            </select>
          </div>
          <div class="form-group">
            <label for="formLocation">首选探访空间 <span class="required">*</span></label>
            <select id="formLocation" name="location" required>
              <option value="桐梓林空间">桐梓林空间（银都花园沙龙）</option>
              <option value="麓湖空间">麓湖空间（水岸先锋实验室）</option>
              <option value="先期全球高清音视频在线沟通">先期全球高清音视频在线沟通</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="formNotes">音乐经历或您想对我们说的话 (选填)</label>
          <textarea id="formNotes" name="notes" rows="3" placeholder="例如：零基础想学立式大贝斯 / 孩子初二有轻微ADHD想找包容的老师 / 想给乐队找个好编曲..."></textarea>
        </div>

        <div class="form-action">
          <button type="submit" class="btn btn-primary btn-large btn-block" id="formSubmitBtn">
            <span>确认提交 · 开启真实声学生态</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 轻量优雅 Toast 提示层 (禁用原生 alert) -->
  <div class="toast-hub" id="toastHub" aria-live="polite"></div>
